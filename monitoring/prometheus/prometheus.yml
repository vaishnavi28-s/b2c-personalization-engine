# Prometheus: system health of the platform (is Airflow alive, how long do tasks take, are slots free).
# Business numbers (checks, gate, buys) live in Postgres and go to Grafana directly - not through here.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    system: nbo

scrape_configs:
  - job_name: airflow                     # Airflow metrics, via the StatsD -> Prometheus bridge
    static_configs:
      - targets: ["statsd-exporter:9102"]
  - job_name: reporting-db                # health of the Postgres that Grafana reads
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/rules/*.yml