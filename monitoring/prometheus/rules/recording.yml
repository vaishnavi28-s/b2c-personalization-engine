# Pre-computed series the dashboards and alerts read (cheap to query, same definition everywhere).
groups:
  - name: airflow
    interval: 1m
    rules:
      - record: nbo:scheduler_heartbeats:rate5m
        expr: sum(rate({__name__=~"airflow_scheduler_heartbeat(_total)?"}[5m]))
      - record: nbo:task_failures:increase1h
        expr: sum by (dag_id, task_id) (increase(airflow_task_finished{state="failed"}[1h]))
      - record: nbo:task_duration_seconds:p95_1d
        expr: histogram_quantile(0.95, sum by (dag_id, task_id, le) (rate(airflow_task_duration_seconds_bucket[1d])))