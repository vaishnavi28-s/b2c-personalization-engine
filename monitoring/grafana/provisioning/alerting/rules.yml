# Alert rules, provisioned at Grafana start-up. GENERATED by monitoring/grafana/build.py - edit there.
# Each rule says what it means and WHAT TO DO. Postgres rules return one number; Prometheus rules take
# the last value.
apiVersion: 1
groups:
- orgId: 1
  name: nbo-pipeline
  folder: NBO
  interval: 5m
  rules:
  - uid: nbo-step-failed
    title: A pipeline step failed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS failed FROM reporting.run_log WHERE status = 'FAILED' AND start_time > (now() AT TIME ZONE
          'UTC') - interval '1 hour'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: critical
      system: nbo
    annotations:
      summary: '{{ $values.A }} procedure run(s) FAILED in the last hour.'
      description: 'WHAT TO DO: dashboard ''NBO - Pipeline health'' > ''Latest result of each step'' shows which step and
        the error. Crashes (error text) were retried by Airflow already; rule stops (no error text: data check, output check)
        need the cause fixed. Then clear the failed Airflow task - every step is safe to re-run.'
  - uid: nbo-send-late
    title: Send not finished by 09:00
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT CASE WHEN extract(day FROM now() AT TIME ZONE 'Europe/Berlin') IN (1, 16) AND (now() AT TIME ZONE 'Europe/Berlin')::time
          > time '09:00' AND NOT EXISTS (SELECT 1 FROM reporting.run_log WHERE procedure_name = 'NBO_EVENTS_SENT' AND status
          = 'SUCCESS' AND run_date = (now() AT TIME ZONE 'Europe/Berlin')::date) THEN 1 ELSE 0 END AS late
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: critical
      system: nbo
    annotations:
      summary: Today is a send day and the send has not finished by 09:00 (it starts 06:00).
      description: 'WHAT TO DO: open the nbo_send run of today in Airflow. Waiting in wait_for_data = upstream purchases not
        loaded; waiting in dev_rehearsal = the monthly DEV rehearsal has not passed; a long train = check the Snowflake query
        history (QUERY_TAG airflow:nbo_send:train). Note: in the 2019-2020 replay send dates are in the past, so this alert
        only acts in live operation.'
  - uid: nbo-emails-stuck
    title: Emails stuck in SENDING
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT coalesce(sum(emails), 0) AS stuck FROM reporting.outbox_status WHERE status = 'SENDING'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 30m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: '{{ $values.A }} email(s) were claimed for sending but never confirmed.'
      description: 'WHAT TO DO: Airflow stopped between sending and marking. Check the mail server log for these EMAIL_IDs
        (header X-NBO-Email-Id). Sent -> set STATUS=''SENT''; not sent -> set STATUS=''READY'' and clear send_emails. They
        are never re-sent automatically (no duplicates).'
  - uid: nbo-export-stale
    title: Dashboards are stale
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT CASE WHEN coalesce(max(exported_at), '1970-01-01') < now() - interval '3 hours' THEN 1 ELSE 0 END AS
          stale FROM reporting.export_log
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: 'The Snowflake -> Postgres copy has not run for 3 hours: dashboards show old numbers.'
      description: 'WHAT TO DO: check the nbo_reporting_export DAG in Airflow (is it paused? failing?). The pipeline itself
        is not affected - only what Grafana shows.'
- orgId: 1
  name: nbo-quality
  folder: NBO
  interval: 15m
  rules:
  - uid: nbo-data-check-failed
    title: Input data check FAILED
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS failed FROM reporting.data_checks WHERE status = 'FAIL' AND checked_at > now() AT TIME
          ZONE 'UTC' - interval '24 hours'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: critical
      system: nbo
    annotations:
      summary: '{{ $values.A }} data check(s) failed: the send was stopped.'
      description: 'WHAT TO DO: dashboard ''NBO - Data quality'' > ''All checks per send date'' shows which check and the
        numbers. Fix the source data upstream (HM_ODS), then clear data_checks in the nbo_send run.'
  - uid: nbo-data-check-warn
    title: Unusual input data (warning)
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS warned FROM reporting.data_checks WHERE status = 'WARN' AND checked_at > now() AT TIME
          ZONE 'UTC' - interval '24 hours'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: '{{ $values.A }} data check warning(s); the send continued.'
      description: 'WHAT TO DO: look at ''Purchase volume vs the 4 weeks before''. A real event (sale, lockdown) needs no
        action; a double or partial load upstream does - ask the data owner before the next send.'
  - uid: nbo-gate-failed
    title: New models rejected by the gate
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS failed FROM reporting.model_registry WHERE gate_status = 'FAIL' AND trained_at > now()
          AT TIME ZONE 'UTC' - interval '24 hours'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: 'This month''s models were more than 20% worse than last month''s: last month''s are used.'
      description: 'WHAT TO DO: dashboard ''NBO - Models and recommendations'' > ''Trainings and gate decisions'' shows both
        numbers. Compare the data checks of the date (a drop in data explains it); if the data is fine, investigate the training
        window before next month. Sends keep working with the old models.'
  - uid: nbo-model-below-baseline
    title: Model does not beat the best sellers
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS behind FROM reporting.model_registry WHERE beats_baseline = false AND trained_at > now()
          AT TIME ZONE 'UTC' - interval '24 hours'
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: A new model scored no better than showing everyone last week's best sellers.
      description: 'WHAT TO DO: dashboard ''NBO - Models and recommendations'' > ''Trainings and gate decisions'', column
        baseline_note says which model and by how much. Sends continue (last month''s model would not be better: same method).
        Check the data checks of the date and the training window; if it repeats next month, the model needs work - consider
        filling that slot from the best sellers until it is fixed.'
  - uid: nbo-emails-hurt
    title: Emails reduce purchases
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: reporting
      model:
        refId: A
        rawQuery: true
        editorMode: code
        format: table
        rawSql: SELECT count(*) AS hurt FROM reporting.eval_results WHERE group_by = 'holdout' AND group_key = 'email_minus_holdout'
          AND metric = 'any_buy_rate' AND ci_high < 0 AND run_date > (now() AT TIME ZONE 'UTC')::date - 120
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0m
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: For a recent send, emailed customers bought LESS than the holdout (whole 95% range below 0).
      description: 'WHAT TO DO: dashboard ''NBO - Evaluation'' > ''Holdout comparison per send''. Check send frequency (fatigue),
        the slots with the lowest buy rate and unsubscribes. One send can be noise; two in a row is a reason to pause sends
        (switch nbo_send_enabled off).'
- orgId: 1
  name: nbo-system
  folder: NBO
  interval: 1m
  rules:
  - uid: nbo-scheduler-down
    title: Airflow scheduler down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: nbo:scheduler_heartbeats:rate5m or vector(0)
        instant: true
        range: false
        editorMode: code
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.01
    noDataState: Alerting
    execErrState: Error
    for: 5m
    isPaused: false
    labels:
      severity: critical
      system: nbo
    annotations:
      summary: 'The Airflow scheduler sent no heartbeat for 5 minutes: nothing is being scheduled.'
      description: 'WHAT TO DO: docker compose ps (is airflow-scheduler healthy?), docker compose logs airflow-scheduler.
        Usually the metadata database or memory. Restart: docker compose up -d airflow-scheduler. Missed sends run automatically
        afterwards (catchup).'
  - uid: nbo-dag-import-errors
    title: A DAG file does not load
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(airflow_dag_processing_import_errors) or vector(0)
        instant: true
        range: false
        editorMode: code
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    isPaused: false
    labels:
      severity: critical
      system: nbo
    annotations:
      summary: '{{ $values.B }} DAG file(s) fail to import: those DAGs are missing from Airflow.'
      description: 'WHAT TO DO: Airflow UI > DAG import errors shows the file and the error. The DAG tests in CI should have
        caught it - check how the change reached main. Revert the commit; the git bundle picks it up within a minute.'
  - uid: nbo-snowflake-queue
    title: Snowflake jobs waiting for hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(airflow_pool_queued_slots{pool="snowflake"}) or vector(0)
        instant: true
        range: false
        editorMode: code
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2h
    isPaused: false
    labels:
      severity: warning
      system: nbo
    annotations:
      summary: Tasks have waited for a Snowflake slot for over 2 hours.
      description: 'WHAT TO DO: a job holds a slot too long (look at ''Snowflake pool'' and running tasks) or too many DAGs
        run at once. Do not just raise the pool: check the Snowflake query history first.'
