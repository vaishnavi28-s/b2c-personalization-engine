# Airflow sends its metrics as StatsD (airflow.<name>). This turns them into Prometheus metrics with labels,
# so Grafana can ask e.g. "failed runs per DAG" instead of parsing names. Timers become histograms (seconds).
defaults:
  observer_type: histogram
  histogram_options:
    buckets: [1, 5, 15, 60, 300, 900, 1800, 3600, 7200, 14400]
mappings:
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_seconds"
    labels: { dag_id: "$1", status: "success" }
  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_seconds"
    labels: { dag_id: "$1", status: "failed" }
  - match: "airflow.dagrun.schedule_delay.*"
    name: "airflow_dagrun_schedule_delay_seconds"
    labels: { dag_id: "$1" }
  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels: { dag_id: "$1", task_id: "$2" }
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_task_finished"
    labels: { dag_id: "$1", task_id: "$2", state: "$3" }
  - match: "airflow.ti.start.*.*"
    name: "airflow_task_started"
    labels: { dag_id: "$1", task_id: "$2" }
  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels: { pool: "$1" }
  - match: "airflow.pool.queued_slots.*"
    name: "airflow_pool_queued_slots"
    labels: { pool: "$1" }
  - match: "airflow.pool.running_slots.*"
    name: "airflow_pool_running_slots"
    labels: { pool: "$1" }
  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_file_parse_seconds"
    labels: { file: "$1" }
  # everything else keeps its name (dots -> underscores): airflow_scheduler_heartbeat, airflow_ti_failures,
  # airflow_dag_processing_import_errors, airflow_executor_open_slots, airflow_triggerer_heartbeat, ...