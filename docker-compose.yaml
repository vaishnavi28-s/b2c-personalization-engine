# =====================================================================================
# The NBO platform on one machine: Airflow (orchestration) + Prometheus / Postgres / Grafana (monitoring).
#
#   cp .env.example .env        fill in the values (never committed)
#   docker compose up -d        start everything (first start also runs airflow-init)
#   Airflow  http://localhost:8080      Grafana  http://localhost:3000      Prometheus  http://localhost:9090
#
# Production choices:
#   - Airflow with CeleryExecutor: API server, scheduler, DAG processor, worker, triggerer as separate services
#   - DAGs come from git main (git DAG bundle), never from this folder: only reviewed, merged code runs
#   - every login comes from .env / the secrets folder; ports are only open on this machine (127.0.0.1)
#   - health checks + restart policies on every service, log files rotated
# =====================================================================================

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    target: runtime
  image: nbo-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  logging: *logging
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Berlin
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@airflow-db/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # DAGs: pulled from the repository's main branch every minute; each run records the commit it ran
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name": "nbo", "classpath": "airflow.providers.git.bundles.git.GitDagBundle",
        "kwargs": {"git_conn_id": "git_nbo", "tracking_ref": "main", "subdir": "airflow/dags", "refresh_interval": 60}}]
    # metrics -> statsd-exporter -> Prometheus
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # connections (environment secrets backend: never stored in the Airflow database or the UI)
    AIRFLOW_CONN_SNOWFLAKE_NBO: >-
      {"conn_type": "snowflake", "login": "NBO_AIRFLOW_SVC", "password": "${SNOWFLAKE_KEY_PASSPHRASE}",
       "schema": "HM_ML", "extra": {"account": "${SNOWFLAKE_ACCOUNT:?set in .env}", "warehouse": "NBO_WH",
       "database": "NBO_REBUILD", "role": "ACCOUNTADMIN", "private_key_file": "/run/secrets/snowflake_key.p8"}}
    AIRFLOW_CONN_POSTGRES_REPORTING: postgresql://nbo_writer:${REPORTING_WRITER_PASSWORD:?set in .env}@reporting-db:5432/reporting
    AIRFLOW_CONN_SMTP_NBO: >-
      {"conn_type": "smtp", "host": "${SMTP_HOST:?set in .env}", "port": ${SMTP_PORT:-587},
       "login": "${SMTP_USER}", "password": "${SMTP_PASSWORD}",
       "extra": {"disable_ssl": true, "disable_tls": false, "from_email": "${NBO_EMAIL_FROM}", "timeout": 30}}
    AIRFLOW_CONN_GIT_NBO: >-
      {"conn_type": "git", "host": "${GIT_REPO_URL:?set in .env}", "login": "x-access-token",
       "password": "${GIT_READ_TOKEN}"}
    # what the DAGs need (airflow/dags/nbo/config.py)
    NBO_EMAIL_FROM: ${NBO_EMAIL_FROM}
    NBO_ALERT_EMAIL: ${ALERT_EMAIL}
  volumes:
    - airflow-logs:/opt/airflow/logs
    - ./secrets/snowflake_airflow_key.p8:/run/secrets/snowflake_key.p8:ro
  depends_on: &airflow-deps
    airflow-db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # ---------------- Airflow ----------------
  airflow-db:
    image: postgres:17.6
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow version
        airflow pools set snowflake 2 "NBO: Snowflake jobs at the same time"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-env
      DUMB_INIT_SETSID: "0"          # lets the worker finish running tasks on shutdown
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-deps
      airflow-apiserver: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-deps
      airflow-init: { condition: service_completed_successfully }

  # ---------------- monitoring ----------------
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    logging: *logging
    restart: unless-stopped
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes: ["./monitoring/statsd/mapping.yml:/etc/statsd/mapping.yml:ro"]

  prometheus:
    image: prom/prometheus:v3.5.5
    logging: *logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      retries: 5

  reporting-db:
    image: postgres:17.6
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: reporting_admin
      POSTGRES_PASSWORD: ${REPORTING_ADMIN_PASSWORD:?set in .env}
      POSTGRES_DB: reporting
      REPORTING_WRITER_PASSWORD: ${REPORTING_WRITER_PASSWORD}
      REPORTING_READER_PASSWORD: ${REPORTING_READER_PASSWORD:?set in .env}
    volumes:
      - reporting-db:/var/lib/postgresql/data
      - ./monitoring/postgres/00_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./monitoring/postgres/init.sql:/docker-entrypoint-initdb.d/sql/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reporting_admin", "-d", "reporting"]
      interval: 10s
      retries: 5

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    logging: *logging
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://grafana_reader:${REPORTING_READER_PASSWORD}@reporting-db:5432/reporting?sslmode=disable
    depends_on:
      reporting-db: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.3.0
    logging: *logging
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${NBO_EMAIL_FROM}
      GF_SMTP_FROM_NAME: NBO monitoring
      GF_ALERT_EMAIL: ${ALERT_EMAIL:?set in .env}
      REPORTING_READER_PASSWORD: ${REPORTING_READER_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      retries: 5
    depends_on:
      reporting-db: { condition: service_healthy }
      prometheus: { condition: service_healthy }

volumes:
  airflow-db:
  airflow-logs:
  prometheus-data:
  reporting-db:
  grafana-data: